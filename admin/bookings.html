<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Bookings - Admin - RentRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3" style="background-color: var(--charcoal);">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-white" href="dashboard.html">
                <i class="fa-solid fa-car-side me-2"></i>RentRide <span class="badge bg-danger ms-2 fs-6">Admin</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-white-50" href="dashboard.html">Overview</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="users.html">Users & Owners</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="vehicles.html">Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link active text-white" href="bookings.html">All Bookings</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="payments.html">Payments</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-light logout-btn"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">System-Wide Bookings</h2>
        </div>

        <div class="card card-custom shadow-sm mb-4">
            <div class="p-4 border-bottom">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label small fw-medium">Search</label>
                        <input type="text" id="bookingSearch" class="form-control form-control-custom" placeholder="Booking ID...">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-medium">Status Filter</label>
                        <select id="statusFilter" class="form-select form-control-custom">
                            <option value="All">All Statuses</option>
                            <option value="Pending">Pending</option>
                            <option value="Accepted">Accepted</option>
                            <option value="Confirmed">Confirmed</option>
                            <option value="Active">Active</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled/Rejected</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div id="loadingIndicator" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
            
            <div class="table-responsive" id="tableContainer" style="display: none;">
                <table class="table mb-0 align-middle table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>ID & Date</th>
                            <th>Vehicle & Owner</th>
                            <th>Renter</th>
                            <th>Dates</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase + Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let allBookingsData = [];
        let cacheData = { users: {}, vehicles: {} };

        function statusBadge(status) {
            const map = {
                'Pending': 'badge-warning', 'Accepted': 'badge-success', 'Confirmed': 'badge-success',
                'Active': 'badge-success', 'Completed': 'badge-neutral', 'Rejected': 'badge-danger', 'Cancelled': 'badge-danger'
            };
            return `<span class="badge-custom ${map[status] || 'badge-neutral'}">${status}</span>`;
        }

        async function init() {
            await Auth.requireRole('admin');

            try {
                // Fetch root data for efficient admin view
                const snapshot = await database.ref('/').once('value');
                const data = snapshot.val() || {};
                
                cacheData.users = data.users || {};
                cacheData.vehicles = data.vehicles || {};
                
                const bookingsObj = data.bookings || {};
                allBookingsData = Object.keys(bookingsObj).map(id => ({
                    id: id,
                    ...bookingsObj[id]
                }));

                // Sort newest first
                allBookingsData.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('tableContainer').style.display = 'block';
                
                renderBookings();
            } catch (err) {
                console.error(err);
                document.getElementById('loadingIndicator').innerHTML = '<div class="alert alert-danger">Failed to load bookings.</div>';
            }
        }

        function renderBookings() {
            const searchStr = document.getElementById('bookingSearch').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const tbody = document.getElementById('bookingsTableBody');
            
            const filtered = allBookingsData.filter(b => {
                const isCancelledFilter = statusFilter === 'Cancelled' && (b.status === 'Cancelled' || b.status === 'Rejected');
                const matchesStatus = statusFilter === 'All' || b.status === statusFilter || isCancelledFilter;
                
                const shortId = b.id.substring(1, 8).toLowerCase();
                const matchesSearch = shortId.includes(searchStr);
                
                return matchesStatus && matchesSearch;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-secondary-gray">No bookings found matching criteria.</td></tr>';
                return;
            }

            let html = '';
            filtered.forEach(b => {
                const reqDate = new Date(b.createdAt).toLocaleDateString();
                const shortId = b.id.substring(1, 8).toUpperCase();
                
                const v = cacheData.vehicles[b.vehicleId];
                const vName = v ? `${v.brand} ${v.model}` : 'Unknown';
                
                const owner = cacheData.users[b.ownerId];
                const oName = owner ? owner.name : 'Unknown Owner';

                const renter = cacheData.users[b.userId];
                const rName = renter ? renter.name : 'Unknown Renter';

                html += `
                    <tr>
                        <td>
                            <p class="mb-0 fw-bold">#${shortId}</p>
                            <p class="mb-0 text-secondary-gray small">${reqDate}</p>
                        </td>
                        <td>
                            <p class="mb-0 fw-medium">${vName}</p>
                            <p class="mb-0 text-secondary-gray small">Owner: ${oName}</p>
                        </td>
                        <td>
                            <p class="mb-0 fw-medium">${rName}</p>
                        </td>
                        <td>
                            <p class="mb-0 small">${b.startDate}</p>
                            <p class="mb-0 small text-secondary-gray">to ${b.endDate}</p>
                        </td>
                        <td>
                            <p class="mb-0 fw-bold text-primary">₹${b.totalAmount.toLocaleString()}</p>
                            <p class="mb-0 small ${b.paymentStatus === 'Paid' ? 'text-success' : 'text-warning'}">${b.paymentStatus}</p>
                        </td>
                        <td>${statusBadge(b.status)}</td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }

        document.getElementById('bookingSearch').addEventListener('input', renderBookings);
        document.getElementById('statusFilter').addEventListener('change', renderBookings);

        init();
    </script>
</body>
</html>
