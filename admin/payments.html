<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - Admin - RentRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3" style="background-color: var(--charcoal);">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-white" href="dashboard.html">
                <i class="fa-solid fa-car-side me-2"></i>RentRide <span class="badge bg-danger ms-2 fs-6">Admin</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-white-50" href="dashboard.html">Overview</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="users.html">Users & Owners</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="vehicles.html">Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="bookings.html">All Bookings</a></li>
                    <li class="nav-item"><a class="nav-link active text-white" href="payments.html">Payments</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-light logout-btn"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Platform Payments</h2>
            <button class="btn btn-outline-primary" onclick="window.print()"><i class="fa-solid fa-print me-2"></i>Export CSV</button>
        </div>

        <div class="card card-custom shadow-sm mb-4">
            <div class="p-4 border-bottom bg-light">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h5 class="fw-bold mb-1">Financial Ledger</h5>
                        <p class="text-secondary-gray small mb-0">Record of all transactions on the platform.</p>
                    </div>
                    <div class="col-md-4 text-md-end mt-3 mt-md-0">
                        <h4 class="fw-bold text-success mb-0" id="totalVol">₹0</h4>
                        <p class="text-secondary-gray small mb-0">Total Processed Volume</p>
                    </div>
                </div>
            </div>
            
            <div id="loadingIndicator" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
            
            <div class="table-responsive" id="tableContainer" style="display: none;">
                <table class="table mb-0 align-middle table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Date</th>
                            <th>Booking ID</th>
                            <th>Renter</th>
                            <th>Owner</th>
                            <th>Method</th>
                            <th>Status</th>
                            <th class="text-end">Amount</th>
                            <th class="text-end">Platform Cut (10%)</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="paymentsTableBody">
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase + Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let cacheData = { users: {} };

        async function init() {
            await Auth.requireRole('admin');

            try {
                const [users, payments] = await Promise.all([
                    DB.getAllUsers(),
                    DB.getAllPayments()
                ]);

                cacheData.users = users.reduce((acc, u) => { acc[u.id] = u; return acc; }, {});
                
                // Show Paid and Pending Verification payments
                const relevantPayments = payments.filter(p => p.status === 'Paid' || p.status === 'Pending Verification');

                // Sort newest first
                relevantPayments.sort((a, b) => new Date(b.paymentDate) - new Date(a.paymentDate));

                let totalVol = 0;

                let html = '';
                relevantPayments.forEach(p => {
                    if(p.status === 'Paid') {
                        totalVol += p.amount;
                    }
                    const date = new Date(p.paymentDate).toLocaleDateString();
                    const shortBid = p.bookingId.substring(1, 8).toUpperCase();
                    
                    const owner = cacheData.users[p.ownerId];
                    const renter = cacheData.users[p.userId];
                    const cut = Math.floor(p.amount * 0.1);

                    let statusBadge = '';
                    if(p.status === 'Paid') statusBadge = '<span class="badge bg-success">Paid</span>';
                    else if(p.status === 'Pending Verification') statusBadge = '<span class="badge bg-warning text-dark">Pending</span>';
                    else statusBadge = `<span class="badge bg-secondary">${p.status}</span>`;

                    let actions = '';
                    if(p.status === 'Pending Verification') {
                        actions = `
                            <button class="btn btn-sm btn-success me-1" onclick="verifyPayment('${p.id}', '${p.bookingId}', true)">Verify</button>
                            <button class="btn btn-sm btn-danger" onclick="verifyPayment('${p.id}', '${p.bookingId}', false)">Reject</button>
                        `;
                    }

                    html += `
                        <tr>
                            <td>${date}</td>
                            <td class="fw-medium small text-secondary-gray">#${shortBid}</td>
                            <td>${renter ? renter.name : 'Unknown'}</td>
                            <td>${owner ? owner.name : 'Unknown'}</td>
                            <td><span class="badge bg-light border text-dark">${p.method}</span></td>
                            <td>${statusBadge}</td>
                            <td class="text-end fw-bold text-charcoal">₹${p.amount.toLocaleString()}</td>
                            <td class="text-end fw-bold text-success bg-light">₹${p.status === 'Paid' ? cut.toLocaleString() : '0'}</td>
                            <td class="text-end">${actions}</td>
                        </tr>
                    `;
                });

                document.getElementById('totalVol').textContent = '₹' + totalVol.toLocaleString();
                
                const tbody = document.getElementById('paymentsTableBody');
                if (relevantPayments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-5 text-secondary-gray">No payments found.</td></tr>';
                } else {
                    tbody.innerHTML = html;
                }

                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('tableContainer').style.display = 'block';
                
            } catch (err) {
                console.error(err);
                document.getElementById('loadingIndicator').innerHTML = '<div class="alert alert-danger">Failed to load payments.</div>';
            }
        }

        window.verifyPayment = async function(paymentId, bookingId, approve) {
            if(!confirm(`Are you sure you want to ${approve ? 'approve' : 'reject'} this payment?`)) return;
            
            try {
                const newStatus = approve ? 'Paid' : 'Rejected';
                await DB.updatePayment(paymentId, { status: newStatus });
                
                if (approve) {
                    const booking = await DB.getBooking(bookingId);
                    if(booking) {
                        let bStatus = booking.status;
                        if(bStatus === 'Accepted') bStatus = 'Confirmed';
                        await DB.updateBooking(bookingId, { paymentStatus: 'Paid', status: bStatus });
                    }
                }
                
                alert(`Payment ${approve ? 'verified' : 'rejected'} successfully.`);
                init();
            } catch(e) {
                console.error(e);
                alert("An error occurred while updating the payment.");
            }
        };

        init();
    </script>
</body>
</html>
