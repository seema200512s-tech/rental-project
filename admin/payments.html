<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - Admin - RentRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3" style="background-color: var(--charcoal);">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-white" href="dashboard.html">
                <i class="fa-solid fa-car-side me-2"></i>RentRide <span class="badge bg-danger ms-2 fs-6">Admin</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-white-50" href="dashboard.html">Overview</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="users.html">Users & Owners</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="vehicles.html">Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="bookings.html">All Bookings</a></li>
                    <li class="nav-item"><a class="nav-link active text-white" href="payments.html">Payments</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-light logout-btn"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Platform Payments</h2>
            <button class="btn btn-outline-primary" onclick="window.print()"><i class="fa-solid fa-print me-2"></i>Export CSV</button>
        </div>

        <div class="card card-custom shadow-sm mb-4">
            <div class="p-4 border-bottom bg-light">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h5 class="fw-bold mb-1">Financial Ledger</h5>
                        <p class="text-secondary-gray small mb-0">Record of all transactions on the platform.</p>
                    </div>
                    <div class="col-md-4 text-md-end mt-3 mt-md-0">
                        <h4 class="fw-bold text-success mb-0" id="totalVol">₹0</h4>
                        <p class="text-secondary-gray small mb-0">Total Processed Volume</p>
                    </div>
                </div>
            </div>
            
            <div id="loadingIndicator" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
            
            <div class="table-responsive" id="tableContainer" style="display: none;">
                <table class="table mb-0 align-middle table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Date</th>
                            <th>Booking ID</th>
                            <th>Renter</th>
                            <th>Owner</th>
                            <th>Method</th>
                            <th class="text-end">Amount</th>
                            <th class="text-end">Platform Cut (10%)</th>
                        </tr>
                    </thead>
                    <tbody id="paymentsTableBody">
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase + Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let cacheData = { users: {} };

        async function init() {
            await Auth.requireRole('admin');

            try {
                // Fetch root data
                const snapshot = await database.ref('/').once('value');
                const data = snapshot.val() || {};
                
                cacheData.users = data.users || {};
                const paymentsObj = data.payments || {};
                
                const allPayments = Object.keys(paymentsObj).map(id => ({
                    id: id,
                    ...paymentsObj[id]
                })).filter(p => p.status === 'Paid');

                // Sort newest first
                allPayments.sort((a, b) => new Date(b.paymentDate) - new Date(a.paymentDate));

                let totalVol = 0;

                let html = '';
                allPayments.forEach(p => {
                    totalVol += p.amount;
                    const date = new Date(p.paymentDate).toLocaleDateString();
                    const shortBid = p.bookingId.substring(1, 8).toUpperCase();
                    
                    const owner = cacheData.users[p.ownerId];
                    const renter = cacheData.users[p.userId];
                    const cut = Math.floor(p.amount * 0.1);

                    html += `
                        <tr>
                            <td>${date}</td>
                            <td class="fw-medium small text-secondary-gray">#${shortBid}</td>
                            <td>${renter ? renter.name : 'Unknown'}</td>
                            <td>${owner ? owner.name : 'Unknown'}</td>
                            <td><span class="badge bg-light border text-dark">${p.method}</span></td>
                            <td class="text-end fw-bold text-charcoal">₹${p.amount.toLocaleString()}</td>
                            <td class="text-end fw-bold text-success bg-light">₹${cut.toLocaleString()}</td>
                        </tr>
                    `;
                });

                document.getElementById('totalVol').textContent = '₹' + totalVol.toLocaleString();
                
                const tbody = document.getElementById('paymentsTableBody');
                if (allPayments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-secondary-gray">No successful payments found.</td></tr>';
                } else {
                    tbody.innerHTML = html;
                }

                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('tableContainer').style.display = 'block';
                
            } catch (err) {
                console.error(err);
                document.getElementById('loadingIndicator').innerHTML = '<div class="alert alert-danger">Failed to load payments.</div>';
            }
        }

        init();
    </script>
</body>
</html>
