<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles - Owner - RentRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="dashboard.html">
                <i class="fa-solid fa-car-side me-2"></i>RentRide <span class="badge bg-primary ms-2 fs-6">Owner</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="add-vehicle.html">Add Vehicle</a></li>
                    <li class="nav-item"><a class="nav-link active" href="manage-vehicles.html">My Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookings.html">Booking Requests</a></li>
                    <li class="nav-item"><a class="nav-link" href="earnings.html">Earnings</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-light logout-btn"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Manage My Vehicles</h2>
            <a href="add-vehicle.html" class="btn btn-primary-custom fw-medium"><i class="fa-solid fa-plus me-2"></i>Add Vehicle</a>
        </div>
        
        <div id="loadingIndicator" class="text-center py-5 text-secondary-gray">
            <div class="spinner-border mb-3" role="status"></div>
            <p>Loading your fleet...</p>
        </div>
        
        <div class="row g-4" id="vehicleGrid" style="display: none;">
            <!-- Vehicles rendered via JS -->
        </div>

        <div id="emptyState" class="text-center py-5 d-none">
            <i class="fa-solid fa-car-tunnel fa-3x text-light-gray mb-3"></i>
            <h4 class="text-charcoal fw-bold">No vehicles found</h4>
            <p class="text-secondary-gray">You haven't listed any vehicles yet.</p>
            <a href="add-vehicle.html" class="btn btn-outline-primary mt-3">Add Your First Vehicle</a>
        </div>
    </div>

    <!-- Edit Price Modal -->
    <div class="modal fade" id="editPriceModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Update Rental Price</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pb-0">
                    <div class="mb-3">
                        <label class="form-label fw-medium small">New Price (per day) ₹</label>
                        <input type="number" id="newPrice" class="form-control form-control-custom" min="100">
                        <input type="hidden" id="editVid">
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-custom" id="savePriceBtn" onclick="saveNewPrice()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase + Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let currentUserId = null;
        const editModal = new bootstrap.Modal(document.getElementById('editPriceModal'));

        function statusBadge(status) {
            const map = {
                'Pending Approval': 'badge-warning',
                'Available': 'badge-success',
                'Booked': 'badge-primary', 'Active': 'badge-primary',
                'Maintenance': 'badge-danger', 'Rejected': 'badge-danger', 'Inactive': 'badge-secondary'
            };
            let text = status;
            if (status === 'Pending Approval') text = 'Waiting for Admin Approval';
            return `<span class="badge-custom ${map[status] || 'badge-neutral'}">${text}</span>`;
        }

        async function init() {
            const owner = await Auth.requireRole('owner');
            currentUserId = owner.uid;
            
            try {
                const vehicles = await DB.getVehiclesByOwner(owner.uid);

                document.getElementById('loadingIndicator').style.display = 'none';
                
                if (vehicles.length === 0) {
                    document.getElementById('emptyState').classList.remove('d-none');
                } else {
                    document.getElementById('vehicleGrid').style.display = 'flex';
                    renderVehicles(vehicles);
                }
            } catch (err) {
                console.error("Error loading vehicles:", err);
                document.getElementById('loadingIndicator').innerHTML = '<div class="alert alert-danger">Error loading vehicles.</div>';
            }
        }

        function renderVehicles(vehicles) {
            const grid = document.getElementById('vehicleGrid');
            grid.innerHTML = '';

            vehicles.forEach(v => {
                let actionButtons = '';
                
                if (v.status === 'Available') {
                    actionButtons = `
                        <button class="btn btn-sm btn-outline-danger w-100 mb-2 fw-medium" onclick="toggleMaintenance('${v.id}', true)">Mark Maintenance</button>
                    `;
                } else if (v.status === 'Maintenance') {
                    actionButtons = `
                        <button class="btn btn-sm btn-success w-100 mb-2 fw-medium" onclick="toggleMaintenance('${v.id}', false)">Available Again</button>
                    `;
                }

                const card = `
                    <div class="col-md-6 col-xl-4" id="card-${v.id}">
                        <div class="card card-custom h-100 shadow-sm">
                            <div class="position-relative">
                                <img src="${v.imageUrl || 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&q=80&w=400'}" alt="${v.brand}" style="height: 180px; width:100%; object-fit: cover; border-radius: 12px 12px 0 0;">
                                <div class="position-absolute top-0 end-0 p-2">
                                    ${statusBadge(v.status)}
                                </div>
                            </div>
                            
                            <div class="p-4 flex-grow-1 d-flex flex-column">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="fw-bold mb-0">${v.brand} ${v.model}</h5>
                                    <h6 class="text-primary fw-bold mb-0">₹<span id="price-${v.id}">${v.price}</span><small class="text-secondary-gray fw-normal">/d</small></h6>
                                </div>
                                <p class="text-secondary-gray small mb-3"><i class="fa-solid fa-hashtag me-1"></i>${v.regNo}</p>
                                ${(v.status === 'Rejected') && v.rejectionReason ? `<div class="alert alert-danger p-2 small mb-3"><i class="fa-solid fa-circle-exclamation me-1"></i><strong>Reason:</strong> ${v.rejectionReason}</div>` : ''}
                                
                                <div class="mt-auto pt-3 border-top">
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-sm btn-light border flex-fill fw-medium" onclick="openPriceModal('${v.id}', ${v.price})"><i class="fa-solid fa-pen me-1"></i>Edit Price</button>
                                        <button class="btn btn-sm btn-light border text-danger flex-fill fw-medium" onclick="deleteVehicle('${v.id}')"><i class="fa-solid fa-trash me-1"></i>Delete</button>
                                    </div>
                                    <div class="mt-2">
                                        ${actionButtons}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        window.openPriceModal = function(id, currentPrice) {
            document.getElementById('editVid').value = id;
            document.getElementById('newPrice').value = currentPrice;
            editModal.show();
        };

        window.saveNewPrice = async function() {
            const id = document.getElementById('editVid').value;
            const price = parseInt(document.getElementById('newPrice').value);
            
            if (!price || price < 100) return;
            
            const btn = document.getElementById('savePriceBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                await DB.updateVehicle(id, { price: price });
                document.getElementById(`price-${id}`).textContent = price;
                editModal.hide();
            } catch (err) {
                alert("Failed to update price.");
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        };

        window.toggleMaintenance = async function(id, isMaintenance) {
            const newStatus = isMaintenance ? 'Maintenance' : 'Available';
            if (confirm(`Mark this vehicle as ${newStatus}?`)) {
                try {
                    await DB.updateVehicle(id, { status: newStatus });
                    window.location.reload();
                } catch (err) {
                    alert("Update failed.");
                }
            }
        };

        window.deleteVehicle = async function(id) {
            if (confirm("WARNING: Are you sure you want to delete this vehicle entirely? This action cannot be undone.")) {
                try {
                    await DB.deleteVehicle(id);
                    document.getElementById(`card-${id}`).remove();
                    if (document.querySelectorAll('[id^="card-"]').length === 0) {
                        document.getElementById('vehicleGrid').classList.add('d-none');
                        document.getElementById('emptyState').classList.remove('d-none');
                    }
                } catch (err) {
                    alert("Delete failed.");
                }
            }
        };

        init();
    </script>
    <script src="../js/footer.js"></script>
</body>
</html>
