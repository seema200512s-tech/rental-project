<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RentRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="card card-custom p-4 p-md-5 shadow" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <div class="mb-3">
                <i class="fa-solid fa-car-side fs-1" style="color: var(--primary-blue);"></i>
            </div>
            <h2 class="fw-bold" style="color: var(--charcoal);">Welcome Back</h2>
            <p class="text-secondary-gray">Login to your RentRide account</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-medium">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-color: var(--input-border); border-radius: 8px 0 0 8px;"><i class="fa-solid fa-envelope text-secondary-gray"></i></span>
                    <input type="email" id="email" class="form-control form-control-custom border-start-0" style="border-radius: 0 8px 8px 0;" placeholder="name@example.com" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-color: var(--input-border); border-radius: 8px 0 0 8px;"><i class="fa-solid fa-lock text-secondary-gray"></i></span>
                    <input type="password" id="password" class="form-control form-control-custom border-start-0" style="border-radius: 0 8px 8px 0;" placeholder="••••••••" required>
                </div>
            </div>

            <div id="loginMsg" class="alert d-none p-2 mb-3 text-center" style="font-size: 0.875rem;"></div>

            <button type="submit" class="btn btn-primary-custom w-100 mb-3 py-2" id="loginBtn">
                <span id="loginBtnText">Login</span>
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
            </button>
            
            <div class="text-center">
                <p class="mb-1 text-secondary-gray" style="font-size: 0.875rem;">Don't have an account?</p>
                <a href="register.html" class="fw-medium" style="font-size: 0.875rem;">Create an Account</a>
            </div>
        </form>
    </div>

    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Seed initial data if DB is empty
        DB.seedIfEmpty();

        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');

        function handleRedirect(userData) {
            if (redirectParam) {
                window.location.href = redirectParam;
                return;
            }
            if (userData.role === 'admin') window.location.href = 'admin/dashboard.html';
            else if (userData.role === 'owner') window.location.href = 'owner/dashboard.html';
            else window.location.href = 'user/dashboard.html';
        }

        // If already logged in, redirect
        Auth.getCurrentUser().then(userData => {
            if (userData) {
                handleRedirect(userData);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('loginMsg');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginSpinner');

            msgBox.classList.add('d-none');
            btn.disabled = true;
            btnText.textContent = 'Logging in...';
            spinner.classList.remove('d-none');

            try {
                const userData = await Auth.login(email, password);

                msgBox.className = 'alert alert-success p-2 mb-3 text-center';
                msgBox.innerHTML = '<i class="fa-solid fa-circle-check me-1"></i>Login successful! Redirecting...';
                msgBox.classList.remove('d-none');
                msgBox.style.fontSize = '0.875rem';

                setTimeout(() => {
                    handleRedirect(userData);
                }, 800);
            } catch (err) {
                let msg = 'Invalid email or password.';
                if (err.message) {
                    msg = err.message;
                }

                msgBox.className = 'alert alert-danger p-2 mb-3 text-center';
                msgBox.innerHTML = '<i class="fa-solid fa-circle-exclamation me-1"></i>' + msg;
                msgBox.classList.remove('d-none');
                msgBox.style.fontSize = '0.875rem';

                btn.disabled = false;
                btnText.textContent = 'Login';
                spinner.classList.add('d-none');
            }
        });
    </script>
    <script src="js/footer.js"></script>
</body>
</html>
