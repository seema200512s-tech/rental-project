<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - RentRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-light">

    <!-- Simple Navbar -->
    <nav class="navbar navbar-custom py-3 shadow-sm">
        <div class="container d-flex justify-content-center">
            <a class="navbar-brand fw-bold fs-4 m-0" href="dashboard.html"><i class="fa-solid fa-car-side me-2"></i>RentRide Secure Checkout</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center g-4">
            <!-- Left: Payment Form -->
            <div class="col-lg-6">
                <div class="card card-custom p-4 p-md-5 shadow">
                    <h4 class="fw-bold mb-4">Payment Details</h4>
                    
                    <div id="paymentAlert" class="alert d-none mb-4"></div>

                    <form id="paymentForm">
                        <div id="upiDetails" class="mb-4 text-center">
                            <h6 class="fw-bold mb-3">Scan this QR code using any UPI app and complete the payment.</h6>
                            <img src="../backend/static/uploads/upi_qr.png" alt="UPI QR Code" class="img-fluid border rounded p-2 mb-3" style="max-width: 250px;">
                            <p class="text-secondary-gray small fw-bold">Amount: ₹<span id="qrAmount">0</span></p>
                        </div>

                        <button type="button" class="btn btn-success w-100 py-3 fw-bold fs-5 shadow-sm" id="completedBtn">
                            I Have Completed Payment
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right: Order Summary -->
            <div class="col-lg-4">
                <div class="card card-custom p-4 shadow-sm">
                    <h5 class="fw-bold mb-4 border-bottom pb-3">Order Summary</h5>
                    
                    <div class="d-flex gap-3 mb-4">
                        <img id="sumImg" src="" class="rounded" style="width: 80px; height: 60px; object-fit: cover;">
                        <div>
                            <h6 class="fw-bold mb-1" id="sumName">Vehicle Name</h6>
                            <p class="text-secondary-gray small mb-0" id="sumDates">Start - End</p>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary-gray">Rental Rate</span>
                        <span class="fw-medium">₹<span id="sumRate">0</span> / day</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                        <span class="text-secondary-gray">Duration</span>
                        <span class="fw-medium" id="sumDays">0 days</span>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold fs-5">Total Pay</span>
                        <h3 class="fw-bold text-primary mb-0">₹<span id="sumTotal">0</span></h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase + Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    
    <script>
        let currentUser = null;
        let currentBooking = null;

        async function init() {
            currentUser = await Auth.requireRole('user');
            
            const params = new URLSearchParams(window.location.search);
            const bid = params.get('bookingId');
            
            if (!bid) {
                window.location.href = 'bookings.html';
                return;
            }

            currentBooking = await DB.getBooking(bid);
            
            if (!currentBooking || currentBooking.userId !== currentUser.id) {
                alert("Invalid booking request.");
                window.location.href = 'bookings.html';
                return;
            }

            if (currentBooking.paymentStatus === 'Paid') {
                alert("This booking has already been paid for.");
                window.location.href = 'bookings.html';
                return;
            }

            // Must be accepted by owner, OR we allow paying while pending depending on business flow.
            // The prompt says "After the booking process and required approval flow, provide a payment page."
            // But we can let them mock pay immediately for demo purposes if we want.
            if(currentBooking.status === 'Rejected' || currentBooking.status === 'Cancelled') {
                alert("This booking is invalid.");
                window.location.href = 'bookings.html';
                return;
            }

            const vehicle = await DB.getVehicle(currentBooking.vehicleId);

            // Populate UI
            document.getElementById('sumName').textContent = `${vehicle.brand} ${vehicle.model}`;
            document.getElementById('sumImg').src = vehicle.imageUrl || 'https://via.placeholder.com/150';
            document.getElementById('sumDates').textContent = `${currentBooking.startDate} to ${currentBooking.endDate}`;
            document.getElementById('sumRate').textContent = currentBooking.pricePerDay.toLocaleString();
            document.getElementById('sumDays').textContent = `${currentBooking.days} days`;
            
            document.getElementById('sumTotal').textContent = currentBooking.totalAmount.toLocaleString();
            document.getElementById('qrAmount').textContent = currentBooking.totalAmount.toLocaleString();
        }

        document.getElementById('completedBtn').addEventListener('click', async function(e) {
            e.preventDefault();
            await processPayment();
        });

        async function processPayment() {
            const btn = document.getElementById('completedBtn');
            const alertBox = document.getElementById('paymentAlert');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';
            alertBox.classList.add('d-none');

            // Simulate network delay
            setTimeout(async () => {
                try {
                    // Create Payment Record
                    const status = 'Pending Verification';
                    const paymentData = {
                        bookingId: currentBooking.id,
                        userId: currentUser.id,
                        ownerId: currentBooking.ownerId,
                        vehicleId: currentBooking.vehicleId,
                        amount: currentBooking.totalAmount,
                        method: 'UPI',
                        status: status,
                        paymentDate: new Date().toISOString()
                    };

                    await DB.addPayment(paymentData);

                    // Update Booking Status
                    let updateData = { paymentStatus: status };
                    await DB.updateBooking(currentBooking.id, updateData);

                    alertBox.className = 'alert alert-success mb-4';
                    alertBox.innerHTML = '<i class="fa-solid fa-circle-check me-2"></i>Payment details submitted! Awaiting admin verification. Redirecting...';
                    alertBox.classList.remove('d-none');

                    setTimeout(() => {
                        window.location.href = 'bookings.html';
                    }, 2000);

                } catch (err) {
                    btn.disabled = false;
                    btn.innerHTML = 'I Have Completed Payment';
                    
                    alertBox.className = 'alert alert-danger mb-4';
                    alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation me-2"></i>Payment failed. Please try again.';
                    alertBox.classList.remove('d-none');
                }
            }, 1500);
        }

        init();
    </script>
</body>
</html>
