<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - RentRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="dashboard.html"><i class="fa-solid fa-car-side me-2"></i>RentRide</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="browse.html">Browse Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link" href="favorites.html">Favorites</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-light logout-btn"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-custom p-4 p-md-5 shadow">
                    <h3 class="fw-bold mb-4 border-bottom pb-3">My Profile</h3>
                    
                    <div id="profileMsg" class="alert d-none mb-4"></div>

                    <form id="profileForm">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Full Name</label>
                                <input type="text" id="pName" class="form-control form-control-custom" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Email Address</label>
                                <input type="email" id="pEmail" class="form-control form-control-custom" disabled readonly>
                                <div class="form-text" style="font-size: 0.75rem;">Email cannot be changed.</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Phone Number</label>
                                <input type="tel" id="pPhone" class="form-control form-control-custom" pattern="[0-9]{10}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Date of Birth</label>
                                <input type="date" id="pDob" class="form-control form-control-custom" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-medium">Address</label>
                                <textarea id="pAddress" class="form-control form-control-custom" rows="3"></textarea>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top text-end">
                            <button type="submit" class="btn btn-primary-custom px-5 py-2" id="saveBtn">
                                <span id="saveBtnText">Save Changes</span>
                                <span id="saveSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase + Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    
    <script>
        let currentUser = null;

        async function init() {
            currentUser = await Auth.requireRole('user');
            
            // Populate form
            document.getElementById('pName').value = currentUser.name || '';
            document.getElementById('pEmail').value = currentUser.email || '';
            document.getElementById('pPhone').value = currentUser.phone || '';
            document.getElementById('pDob').value = currentUser.dob || '';
            document.getElementById('pAddress').value = currentUser.address || '';
        }

        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('saveBtn');
            const btnText = document.getElementById('saveBtnText');
            const spinner = document.getElementById('saveSpinner');
            const msgBox = document.getElementById('profileMsg');
            
            btn.disabled = true;
            btnText.textContent = 'Saving...';
            spinner.classList.remove('d-none');
            msgBox.classList.add('d-none');

            const updatedData = {
                name: document.getElementById('pName').value.trim(),
                phone: document.getElementById('pPhone').value.trim(),
                dob: document.getElementById('pDob').value,
                address: document.getElementById('pAddress').value.trim()
            };

            try {
                await DB.updateUser(currentUser.uid, updatedData);
                
                // Update session storage name for UI consistency
                sessionStorage.setItem('userName', updatedData.name);
                
                msgBox.className = 'alert alert-success mb-4';
                msgBox.innerHTML = '<i class="fa-solid fa-circle-check me-2"></i>Profile updated successfully!';
                msgBox.classList.remove('d-none');
            } catch (err) {
                msgBox.className = 'alert alert-danger mb-4';
                msgBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation me-2"></i>Failed to update profile.';
                msgBox.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Save Changes';
                spinner.classList.add('d-none');
            }
        });

        init();
    </script>
</body>
</html>
