<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - RentRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="dashboard.html"><i class="fa-solid fa-car-side me-2"></i>RentRide</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="browse.html">Browse Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link active" href="favorites.html">Favorites</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-light logout-btn"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">My Favorite Vehicles</h2>
        </div>
        
        <div id="loadingIndicator" class="text-center py-5 text-secondary-gray">
            <div class="spinner-border mb-3" role="status"></div>
            <p>Loading your favorites...</p>
        </div>
        
        <div class="row g-4" id="vehicleGrid" style="display: none;">
            <!-- Vehicles rendered via JS -->
        </div>

        <div id="emptyState" class="text-center py-5 d-none">
            <i class="fa-solid fa-heart fa-3x text-light-gray mb-3"></i>
            <h4 class="text-charcoal fw-bold">No favorites yet</h4>
            <p class="text-secondary-gray">Browse vehicles and click the heart icon to save them here.</p>
            <a href="browse.html" class="btn btn-outline-primary mt-3">Browse Vehicles</a>
        </div>
    </div>

    <!-- Firebase + Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    
    <script>
        let currentUserId = null;

        async function init() {
            const user = await Auth.requireRole('user');
            currentUserId = user.uid;
            
            try {
                const favIds = await DB.getFavorites(user.uid);
                
                if (favIds.length === 0) {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    document.getElementById('emptyState').classList.remove('d-none');
                    return;
                }

                // Fetch full vehicle objects for the fav IDs
                const vehiclePromises = favIds.map(id => DB.getVehicle(id));
                const allVehicles = await Promise.all(vehiclePromises);
                
                // Filter out nulls (deleted vehicles)
                const validVehicles = allVehicles.filter(v => v !== null);

                // Fetch ratings
                const ratingPromises = validVehicles.map(v => DB.getAverageRating(v.id));
                const ratings = await Promise.all(ratingPromises);
                validVehicles.forEach((v, idx) => {
                    v.ratingData = ratings[idx];
                });

                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('vehicleGrid').style.display = 'flex';
                renderVehicles(validVehicles, favIds);
            } catch (err) {
                console.error("Error loading favorites:", err);
                document.getElementById('loadingIndicator').innerHTML = '<div class="alert alert-danger">Error loading favorites.</div>';
            }
        }

        function renderVehicles(vehicles, favIds) {
            const grid = document.getElementById('vehicleGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (vehicles.length === 0) {
                grid.classList.add('d-none');
                emptyState.classList.remove('d-none');
                return;
            }

            vehicles.forEach(v => {
                const ratingHtml = v.ratingData.count > 0 
                    ? `<i class="fa-solid fa-star text-warning me-1"></i><span class="fw-bold">${v.ratingData.avg}</span> <span class="text-secondary-gray small">(${v.ratingData.count})</span>` 
                    : `<span class="text-secondary-gray small">No reviews yet</span>`;

                const availabilityBadge = v.status === 'Available' 
                    ? `<span class="badge bg-success px-3 py-2 rounded-pill shadow-sm">Available</span>`
                    : `<span class="badge bg-danger px-3 py-2 rounded-pill shadow-sm">Unavailable</span>`;

                const card = `
                    <div class="col-md-6 col-lg-4" id="card-${v.id}">
                        <div class="card-custom h-100 d-flex flex-column">
                            <div class="position-relative">
                                <img src="${v.imageUrl || 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&q=80&w=400'}" class="card-custom-img" alt="${v.brand} ${v.model}" style="height: 220px; object-fit: cover;">
                                <div class="position-absolute top-0 end-0 p-3">
                                    <button class="btn btn-light rounded-circle shadow-sm fav-btn border-0" data-id="${v.id}" style="width: 40px; height: 40px;">
                                        <i class="fa-solid fa-heart text-danger"></i>
                                    </button>
                                </div>
                                <div class="position-absolute bottom-0 start-0 p-3 w-100 d-flex justify-content-between">
                                    <span class="badge bg-primary px-3 py-2 rounded-pill shadow-sm">${v.type}</span>
                                    ${availabilityBadge}
                                </div>
                            </div>
                            
                            <div class="card-custom-body flex-grow-1">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="fw-bold mb-0 text-truncate pe-2">${v.brand} ${v.model}</h5>
                                </div>
                                <p class="text-primary fw-bold fs-5 mb-3">₹${v.price?.toLocaleString()} <span class="text-secondary-gray fw-normal fs-6">/ day</span></p>
                                
                                <div class="row g-2 mb-4 small text-secondary-gray">
                                    <div class="col-6"><i class="fa-solid fa-gas-pump me-2 w-15px text-center"></i>${v.fuelType}</div>
                                    <div class="col-6"><i class="fa-solid fa-gears me-2 w-15px text-center"></i>${v.transmission}</div>
                                    <div class="col-6"><i class="fa-solid fa-users me-2 w-15px text-center"></i>${v.seats} Seats</div>
                                    <div class="col-6"><i class="fa-solid fa-location-dot me-2 w-15px text-center"></i>${v.location}</div>
                                </div>
                                
                                <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                                    <div>${ratingHtml}</div>
                                    ${v.status === 'Available' ? `<a href="vehicle-details.html?id=${v.id}" class="btn btn-primary-custom px-4">View</a>` : `<button class="btn btn-secondary px-4" disabled>Unavailable</button>`}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });

            // Bind Remove Favorite Buttons
            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const vid = e.currentTarget.dataset.id;
                    await DB.removeFavorite(currentUserId, vid);
                    
                    // Remove from UI
                    document.getElementById(`card-${vid}`).remove();
                    
                    // Show empty state if none left
                    if (document.querySelectorAll('[id^="card-"]').length === 0) {
                        grid.classList.add('d-none');
                        emptyState.classList.remove('d-none');
                    }
                });
            });
        }

        init();
    </script>
    <script src="../js/footer.js"></script>
</body>
</html>
