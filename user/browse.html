<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Vehicles - RentRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="dashboard.html"><i class="fa-solid fa-car-side me-2"></i>RentRide</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="browse.html">Browse Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link" href="favorites.html">Favorites</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-light logout-btn"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="fw-bold mb-4">Find Your Perfect Ride</h2>

        <!-- Filters -->
        <div class="card card-custom p-3 mb-5">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-medium small text-secondary-gray">Search</label>
                    <input type="text" id="searchInput" class="form-control form-control-custom" placeholder="Brand, model, or location...">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-medium small text-secondary-gray">Vehicle Type</label>
                    <select id="typeFilter" class="form-select form-control-custom">
                        <option value="">All Types</option>
                        <option value="Car">Car</option>
                        <option value="SUV">SUV</option>
                        <option value="Bike">Bike</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-medium small text-secondary-gray">Max Price/Day</label>
                    <input type="number" id="priceFilter" class="form-control form-control-custom" placeholder="e.g. 5000">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-medium small text-secondary-gray">Fuel Type</label>
                    <select id="fuelFilter" class="form-select form-control-custom">
                        <option value="">All Fuels</option>
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="Electric">Electric</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary-custom w-100" id="applyFiltersBtn"><i class="fa-solid fa-filter me-2"></i>Filter</button>
                </div>
            </div>
        </div>

        <!-- Vehicle Grid -->
        <div id="loadingIndicator" class="text-center py-5 text-secondary-gray">
            <div class="spinner-border mb-3" role="status"></div>
            <p>Loading available vehicles...</p>
        </div>
        
        <div class="row g-4" id="vehicleGrid" style="display: none;">
            <!-- Vehicles rendered via JS -->
        </div>

        <div id="emptyState" class="text-center py-5 d-none">
            <i class="fa-solid fa-car-tunnel fa-3x text-light-gray mb-3"></i>
            <h4 class="text-charcoal fw-bold">No vehicles found</h4>
            <p class="text-secondary-gray">Try adjusting your filters to find what you're looking for.</p>
            <button class="btn btn-outline-primary" id="clearFiltersBtn">Clear Filters</button>
        </div>
    </div>

    <!-- Firebase + Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let allVehicles = [];
        let favIds = [];
        let currentUserId = null;

        async function init() {
            const user = await Auth.requireRole('user');
            currentUserId = user.uid;
            
            try {
                // Load favorites
                favIds = await DB.getFavorites(user.uid);
                
                // Load ONLY 'Available' vehicles (Admin approved)
                allVehicles = await DB.getAvailableVehicles();
                
                // Fetch average ratings concurrently
                const ratingPromises = allVehicles.map(v => DB.getAverageRating(v.id));
                const ratings = await Promise.all(ratingPromises);
                allVehicles.forEach((v, idx) => {
                    v.ratingData = ratings[idx];
                });

                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('vehicleGrid').style.display = 'flex';
                renderVehicles(allVehicles);
            } catch (err) {
                console.error("Error loading vehicles:", err);
                document.getElementById('loadingIndicator').innerHTML = '<div class="alert alert-danger">Error loading vehicles. Please try again.</div>';
            }
        }

        function renderVehicles(vehicles) {
            const grid = document.getElementById('vehicleGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (vehicles.length === 0) {
                grid.classList.add('d-none');
                emptyState.classList.remove('d-none');
                return;
            }

            grid.classList.remove('d-none');
            emptyState.classList.add('d-none');

            vehicles.forEach(v => {
                const isFav = favIds.includes(v.id);
                const favClass = isFav ? 'fa-solid text-danger' : 'fa-regular text-secondary-gray';
                const ratingHtml = v.ratingData.count > 0 
                    ? `<i class="fa-solid fa-star text-warning me-1"></i><span class="fw-bold">${v.ratingData.avg}</span> <span class="text-secondary-gray small">(${v.ratingData.count})</span>` 
                    : `<span class="text-secondary-gray small">No reviews yet</span>`;

                const card = `
                    <div class="col-md-6 col-lg-4">
                        <div class="card-custom h-100 d-flex flex-column">
                            <div class="position-relative">
                                <img src="${v.imageUrl || 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&q=80&w=400'}" class="card-custom-img" alt="${v.brand} ${v.model}" style="height: 220px; object-fit: cover;">
                                <div class="position-absolute top-0 end-0 p-3">
                                    <button class="btn btn-light rounded-circle shadow-sm fav-btn border-0" data-id="${v.id}" style="width: 40px; height: 40px;">
                                        <i class="${favClass} fa-heart"></i>
                                    </button>
                                </div>
                                <div class="position-absolute bottom-0 start-0 p-3 w-100" style="background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);">
                                    <span class="badge bg-primary px-3 py-2 rounded-pill shadow-sm">${v.type}</span>
                                </div>
                            </div>
                            
                            <div class="card-custom-body flex-grow-1">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="fw-bold mb-0 text-truncate pe-2">${v.brand} ${v.model}</h5>
                                </div>
                                <p class="text-primary fw-bold fs-5 mb-3">₹${v.price?.toLocaleString()} <span class="text-secondary-gray fw-normal fs-6">/ day</span></p>
                                
                                <div class="row g-2 mb-4 small text-secondary-gray">
                                    <div class="col-6"><i class="fa-solid fa-gas-pump me-2 w-15px text-center"></i>${v.fuelType}</div>
                                    <div class="col-6"><i class="fa-solid fa-gears me-2 w-15px text-center"></i>${v.transmission}</div>
                                    <div class="col-6"><i class="fa-solid fa-users me-2 w-15px text-center"></i>${v.seats} Seats</div>
                                    <div class="col-6"><i class="fa-solid fa-location-dot me-2 w-15px text-center"></i>${v.location}</div>
                                </div>
                                
                                <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                                    <div>${ratingHtml}</div>
                                    <a href="vehicle-details.html?id=${v.id}" class="btn btn-primary-custom px-4">View & Book</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });

            // Bind Favorite Buttons
            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const vid = e.currentTarget.dataset.id;
                    const icon = e.currentTarget.querySelector('i');
                    const isFav = favIds.includes(vid);

                    if (isFav) {
                        await DB.removeFavorite(currentUserId, vid);
                        favIds = favIds.filter(id => id !== vid);
                        icon.className = 'fa-regular fa-heart text-secondary-gray';
                    } else {
                        await DB.addFavorite(currentUserId, vid);
                        favIds.push(vid);
                        icon.className = 'fa-solid fa-heart text-danger';
                    }
                });
            });
        }

        // Filtering
        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('typeFilter').value;
            const price = parseInt(document.getElementById('priceFilter').value) || Infinity;
            const fuel = document.getElementById('fuelFilter').value;

            const filtered = allVehicles.filter(v => {
                const matchSearch = (v.brand + ' ' + v.model + ' ' + v.location).toLowerCase().includes(search);
                const matchType = type === '' || v.type === type;
                const matchPrice = v.price <= price;
                const matchFuel = fuel === '' || v.fuelType === fuel;
                return matchSearch && matchType && matchPrice && matchFuel;
            });

            renderVehicles(filtered);
        }

        document.getElementById('applyFiltersBtn').addEventListener('click', applyFilters);
        document.getElementById('searchInput').addEventListener('keyup', (e) => { if(e.key === 'Enter') applyFilters(); });
        
        document.getElementById('clearFiltersBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('priceFilter').value = '';
            document.getElementById('fuelFilter').value = '';
            renderVehicles(allVehicles);
        });

        // Start
        init();
    </script>
</body>
</html>
